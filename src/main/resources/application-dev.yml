spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_URL}/souf_testdb
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      port: 6379
      ssl:
        enabled: false

      host: redis-container

logging:
  level:
    root: debug

    org.apache.http.impl.conn.PoolingHttpClientConnectionManager: info

    org.hibernate.internal.util.EntityPrinter: warn
    org.hibernate.orm: info

    io.lettuce.core.protocol.CommandHandler: info
    io.lettuce.core: info