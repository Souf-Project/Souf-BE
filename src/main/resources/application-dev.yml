spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_URL}/souf_testdb
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      port: 6379
      ssl:
        enabled: false

      host: localhost